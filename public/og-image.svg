<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Metaincognita branded background (design-system.md §8) + video poker content layer.
       Structure mirrors the canonical blackjack og-image.svg (navy diagonal gradient,
       fine/major grids, dot overlay, vignette, corner registration marks, glowing title,
       mono stat chips, bottom METAINCOGNITA rule); accent and content layer differ.
       Accent = the machine golds from app/assets/css/main.css (vp-gold, vp-gold-bright).
       Every figure shown is sourced from the app: the dealt hand and its three hold EVs are
       the worked example in README "Exhaustive EV Analysis"; 99.54% / 100.76% are the
       returnPct values in app/utils/payTables.ts; 32 holds from app/utils/evCalculator.ts.
       Render: rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c1a"/>
      <stop offset="1" stop-color="#060810"/>
    </linearGradient>
    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e2848" stroke-width="0.6" opacity="0.75"/>
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#283458" stroke-width="1.2"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#2a3460"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <!-- machine screen -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="held" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="cabShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- background stack -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid-fine)"/>
  <rect width="1200" height="630" fill="url(#grid-major)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ====================== content layer: the machine ====================== -->
  <g filter="url(#cabShadow)">
    <rect x="532" y="282" width="628" height="290" rx="22" fill="url(#screen)" stroke="#4a4a6e" stroke-width="2"/>
    <rect x="540" y="290" width="612" height="274" rx="16" fill="none" stroke="#c9a227" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <text x="846" y="316" font-family="'Fira Code', Menlo, monospace" font-size="14" letter-spacing="5" fill="#9aa3d0" text-anchor="middle">9/6 JACKS OR BETTER</text>

  <!-- dealt hand: A♣ Q♦ J♣ 10♣ 9♣ — optimal hold is the four-card flush -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- HELD tags -->
    <g font-family="'Fira Code', Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#1a1a2e">
      <rect x="574" y="332" width="76" height="20" rx="4" fill="url(#held)"/><text x="612" y="346">HELD</text>
      <rect x="808" y="332" width="76" height="20" rx="4" fill="url(#held)"/><text x="846" y="346">HELD</text>
      <rect x="925" y="332" width="76" height="20" rx="4" fill="url(#held)"/><text x="963" y="346">HELD</text>
      <rect x="1042" y="332" width="76" height="20" rx="4" fill="url(#held)"/><text x="1080" y="346">HELD</text>
    </g>
    <!-- A♣ -->
    <g filter="url(#cardShadow)" transform="translate(560 362)">
      <rect width="104" height="146" rx="10" fill="#fafaf9" stroke="#c9a227" stroke-width="3"/>
      <text x="11" y="33" font-size="28" font-weight="700" fill="#1a1a2e">A</text>
      <text x="11" y="58" font-size="22" fill="#1a1a2e">&#9827;</text>
      <text x="52" y="106" font-size="50" fill="#1a1a2e" text-anchor="middle">&#9827;</text>
    </g>
    <!-- Q♦ (discarded: dimmed) -->
    <g filter="url(#cardShadow)" transform="translate(677 362)">
      <rect width="104" height="146" rx="10" fill="#fafaf9" stroke="#c8c8d4"/>
      <text x="11" y="33" font-size="28" font-weight="700" fill="#dc2626">Q</text>
      <text x="11" y="58" font-size="22" fill="#dc2626">&#9830;</text>
      <text x="52" y="106" font-size="50" fill="#dc2626" text-anchor="middle">&#9830;</text>
      <rect width="104" height="146" rx="10" fill="#0a0c1a" fill-opacity="0.45"/>
    </g>
    <!-- J♣ -->
    <g filter="url(#cardShadow)" transform="translate(794 362)">
      <rect width="104" height="146" rx="10" fill="#fafaf9" stroke="#c9a227" stroke-width="3"/>
      <text x="11" y="33" font-size="28" font-weight="700" fill="#1a1a2e">J</text>
      <text x="11" y="58" font-size="22" fill="#1a1a2e">&#9827;</text>
      <text x="52" y="106" font-size="50" fill="#1a1a2e" text-anchor="middle">&#9827;</text>
    </g>
    <!-- 10♣ -->
    <g filter="url(#cardShadow)" transform="translate(911 362)">
      <rect width="104" height="146" rx="10" fill="#fafaf9" stroke="#c9a227" stroke-width="3"/>
      <text x="9" y="33" font-size="26" font-weight="700" fill="#1a1a2e">10</text>
      <text x="11" y="58" font-size="22" fill="#1a1a2e">&#9827;</text>
      <text x="52" y="106" font-size="50" fill="#1a1a2e" text-anchor="middle">&#9827;</text>
    </g>
    <!-- 9♣ -->
    <g filter="url(#cardShadow)" transform="translate(1028 362)">
      <rect width="104" height="146" rx="10" fill="#fafaf9" stroke="#c9a227" stroke-width="3"/>
      <text x="11" y="33" font-size="28" font-weight="700" fill="#1a1a2e">9</text>
      <text x="11" y="58" font-size="22" fill="#1a1a2e">&#9827;</text>
      <text x="52" y="106" font-size="50" fill="#1a1a2e" text-anchor="middle">&#9827;</text>
    </g>
  </g>

  <!-- optimal-play strip under the hand -->
  <text x="846" y="546" font-family="'Fira Code', Menlo, monospace" font-size="17" font-weight="700" letter-spacing="3" fill="#ffd60a" text-anchor="middle" filter="url(#glow)">OPTIMAL &#8212; HOLD THE FLUSH DRAW</text>

  <!-- exact hold-EV motif (the brute-force engine, left) -->
  <g transform="translate(66 330)" opacity="0.92">
    <text x="0" y="0" font-family="'Fira Code', Menlo, monospace" font-size="13" fill="#64748b" letter-spacing="2">EXACT EV &#183; ALL 32 HOLDS</text>
    <g font-family="'Fira Code', Menlo, monospace" font-size="15">
      <text x="0" y="34" fill="#4ade80">&#9656;</text><text x="20" y="34" fill="#4ade80">A&#9827; J&#9827; 10&#9827; 9&#9827;</text><text x="400" y="34" fill="#4ade80" text-anchor="end">1.2766</text>
      <text x="20" y="62" fill="#9aa3d0">A&#9827; J&#9827; 10&#9827;</text><text x="400" y="62" fill="#9aa3d0" text-anchor="end">1.2692</text>
      <text x="20" y="90" fill="#9aa3d0">A&#9827; Q&#9830; J&#9827; 10&#9827;</text><text x="400" y="90" fill="#9aa3d0" text-anchor="end">0.8085</text>
      <text x="20" y="118" fill="#64748b">&#8230;and 29 other holds</text>
    </g>
    <line x1="0" y1="134" x2="400" y2="134" stroke="#283458" stroke-width="1"/>
    <text x="0" y="160" font-family="'Fira Code', Menlo, monospace" font-size="14" fill="#c9a227">EVERY MISTAKE PRICED IN DOLLARS</text>
  </g>

  <!-- title block -->
  <g>
    <text x="64" y="118" font-family="'Fira Code', Menlo, monospace" font-size="58" font-weight="700" fill="#ffd60a" filter="url(#glow)">Video Poker Trainer</text>
    <text x="66" y="162" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#64748b" letter-spacing="1">Exhaustive EV analysis &#183; Mistake cost tracking &#183; Pay-table literacy</text>
    <text x="66" y="200" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a1a1aa" letter-spacing="5">READ THE PAY TABLE. HOLD THE RIGHT CARDS. KNOW THE COST.</text>
  </g>

  <!-- mono stat chips -->
  <g font-family="'Fira Code', Menlo, monospace" font-size="15">
    <rect x="66" y="232" width="148" height="34" rx="8" fill="#10182e" stroke="#ffd60a" stroke-opacity="0.6"/>
    <text x="80" y="255" fill="#ffd60a">9/6 JoB 99.54%</text>
    <rect x="228" y="232" width="194" height="34" rx="8" fill="#10182e" stroke="#4ade80" stroke-opacity="0.6"/>
    <text x="242" y="255" fill="#4ade80">Deuces Wild 100.76%</text>
    <rect x="436" y="232" width="190" height="34" rx="8" fill="#10182e" stroke="#f5f0e1" stroke-opacity="0.6"/>
    <text x="450" y="255" fill="#f5f0e1">exact, not sampled</text>
  </g>

  <!-- vignette over everything except chrome -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- corner registration marks -->
  <g stroke="#3a4570" stroke-width="2" fill="none">
    <path d="M 24 44 L 24 24 L 44 24"/>
    <path d="M 1156 24 L 1176 24 L 1176 44"/>
    <path d="M 1176 586 L 1176 606 L 1156 606"/>
    <path d="M 44 606 L 24 606 L 24 586"/>
  </g>

  <!-- bottom branding -->
  <rect x="64" y="594" width="120" height="4" fill="#ffd60a"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#1e2848" stroke-width="1"/>
  <text x="64" y="621" font-family="'Fira Code', Menlo, monospace" font-size="13" fill="#3a4570" letter-spacing="6">METAINCOGNITA</text>
  <text x="1136" y="621" font-family="'Fira Code', Menlo, monospace" font-size="13" fill="#3a4570" letter-spacing="2" text-anchor="end">CASINO SIMULATOR SUITE</text>
</svg>
