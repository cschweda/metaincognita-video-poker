[build]
  # Deploy gate: a broken lint/typecheck/test must fail the deploy, not just
  # GitHub CI (the two pipelines are independent). The fast test project runs
  # here (~5s); the full statistical suite still runs in GitHub Actions.
  command = "pnpm lint && pnpm typecheck && pnpm test:fast && pnpm generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA catch-all — all routes served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — no framing allowed
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"

    # Control referrer leakage
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable unnecessary browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), autoplay=(), encrypted-media=(), picture-in-picture=(), display-capture=()"

    # Force HTTPS (Netlify handles TLS, but belt + suspenders)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Prevent cross-origin info leaks
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-origin"

    # The legacy XSS auditor is deprecated and could itself be abused; current
    # guidance is to switch it off and rely on the CSP below
    X-XSS-Protection = "0"

    # CSP — strict as possible for a client-side SPA
    # - No external scripts, no eval needed (Nuxt prebuilds everything)
    # - Inline styles required by Vue/Nuxt UI runtime
    # - Fonts are downloaded at build time by @nuxt/fonts and served from /_fonts
    # - Icons are bundled at build time (icon.clientBundle.scan), so nothing
    #   connects to a third-party origin at runtime
    # - blob: for Web Worker creation
    # - data: for inline SVG/font references
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Cache static assets aggressively
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Content-hashed font files emitted by @nuxt/fonts
[[headers]]
  for = "/_fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
